<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f5ef">
  <title>Textworld — 함께 쓰는 지도</title>
  <link rel="preload" href="/fonts/sarasa-fixed-k-regular-1.0.43.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/sarasa.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app" aria-label="Textworld 공유 지도">
    <div id="viewport">
      <canvas id="field" aria-label="공유 글자 지도. 드래그하거나 스크롤하면 중앙 커서가 이동합니다. 지도를 탭하고 중앙 칸에 입력하세요."></canvas>
      <div id="input" contenteditable="false" role="textbox" aria-multiline="true" aria-disabled="true" tabindex="0" inputmode="text" enterkeyhint="enter" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="지도 커서 위치에 바로 입력" aria-describedby="map-instructions"></div>
      <div id="cursor" aria-hidden="true" hidden></div>
      <p id="map-instructions" class="sr-only">지도를 움직이면 입력 위치가 바뀝니다. 커서는 중심부를 따라가며 움직임이 끝나면 중심보다 조금 위에 놓입니다. 지도를 탭하면 키보드를 열어 커서 위치에 입력합니다. 방향키로 이동하고, Enter로 글을 시작한 열의 다음 행에 갑니다. 입력은 기존 글자를 덮어씁니다.</p>
    </div>

    <div class="top-controls">
      <div class="identity surface" aria-label="세계 연결 상태">
        <div class="world-status"><span id="connection-dot" aria-hidden="true"></span><span id="connection">연결 중</span><span class="status-divider" aria-hidden="true">·</span><span id="population">0명 접속</span></div>
      </div>
      <nav class="map-actions" aria-label="지도 메뉴">
        <button id="share" class="icon-button surface" aria-label="이곳 링크 복사" title="이곳 링크 복사"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-9 9M10 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/></svg></button>
      </nav>
    </div>



    <div class="navigation-controls" role="group" aria-label="지도 조작">
      <button id="gps" class="icon-button surface" aria-label="내 GPS 위치로 이동" title="내 GPS 위치로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/></svg></button>
    </div>

    <div id="intro" aria-hidden="true" hidden><span class="intro-mark">t<span>_</span></span><span>textworld</span></div>
    <div id="notice" role="status" aria-live="polite" hidden></div>


  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
